name: zagruziplease

services:
  base-image:
    image: yt-base-image
    build:
      dockerfile: base.Dockerfile
    deploy:
      mode: replicated
      replicas: 0
  yt_api:
    container_name: zagruziplease_api
    build:
      context: .
      dockerfile: app_api/Dockerfile
    env_file:
      - envs/common.env
      - envs/secrets.env
      - envs/api.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:1984:8000"
    command: bash -c "python start.py && python main.py"
    depends_on:
      - yt_postgres
      - yt_rabbitmq
      - yt_worker
      - yt_redis
  yt_bot:
    container_name: zagruziplease_bot
    build:
      context: .
      dockerfile: app_bot/Dockerfile
    env_file:
      - envs/common.env
      - envs/secrets.env
      - envs/bot.env
    restart: unless-stopped
    command: >
      bash -c "python start.py && python main.py"
    depends_on:
      - yt_postgres
      - yt_rabbitmq
      - yt_worker
      - yt_api
    volumes:
      - "download_tmp:/tmp/download_tmpfs"
  yt_worker:
    container_name: zagruziplease_worker
    build:
      context: .
      dockerfile: app_worker/Dockerfile
    env_file:
      - envs/common.env
      - envs/secrets.env
      - envs/worker.env
    restart: unless-stopped
    command: >
      bash -c "python start.py && alembic upgrade head && python main.py"
    depends_on:
      - yt_postgres
      - yt_rabbitmq
    volumes:
      - "filestorage:/filestorage"
      - "download_tmp:/tmp/download_tmpfs"
  yt_postgres:
    container_name: zagruziplease_postgres
    image: "postgres:15"
    env_file:
      - envs/common.env
      - envs/secrets.env
    ports:
      - "127.0.0.1:5435:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
  yt_rabbitmq:
    image: "rabbitmq:3.12-management-alpine"
    container_name: zagruziplease_rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - "./rabbitmq/conf.d/20-consumer-timeout.conf:/etc/rabbitmq/conf.d/20-consumer-timeout.conf:ro"
    restart: unless-stopped
  yt_redis:
    image: "redis:alpine"
    container_name: zagruziplease_redis
    restart: unless-stopped

volumes:
  pgdata:
  filestorage:
  # Временные файлы yt-dlp — на диске, не tmpfs: на 2 ГБ RAM место под ролик в памяти не держим.
  download_tmp:
